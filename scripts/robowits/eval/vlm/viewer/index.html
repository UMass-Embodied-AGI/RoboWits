<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VLM Episodes</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f0f2f5; --border: #dfe3e8; --text: #1d2228; --muted: #67707b;
  --accent: #2f6fdf; --ok: #1f8a4c; --bad: #c8382f; --warn: #b7791f; --run: #2f6fdf; --code: #f3f4f6;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --panel: #191c21; --panel-2: #20242a; --border: #2c3138; --text: #e6e8eb; --muted: #959ca6;
    --accent: #6e9cff; --ok: #4cc27c; --bad: #ff6b61; --warn: #e3a64a; --run: #6e9cff; --code: #15181c;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --panel: #191c21; --panel-2: #20242a; --border: #2c3138; --text: #e6e8eb; --muted: #959ca6;
  --accent: #6e9cff; --ok: #4cc27c; --bad: #ff6b61; --warn: #e3a64a; --run: #6e9cff; --code: #15181c;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
.app { display: grid; grid-template-columns: 320px minmax(0, 1fr); height: 100vh; }
aside { border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
aside header { padding: 14px 14px 10px; border-bottom: 1px solid var(--border); }
aside h1 { margin: 0 0 2px; font-size: 15px; }
aside .root { color: var(--muted); font: 11px var(--mono); word-break: break-all; }
aside input { width: 100%; margin-top: 10px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel-2); color: var(--text); font: inherit; }
#list { overflow-y: auto; flex: 1; padding: 6px 0 20px; }
.group { margin-top: 6px; }
.group > .gname { padding: 6px 14px; font: 600 11px var(--mono); color: var(--muted); text-transform: none; cursor: pointer; user-select: none; }
.group.closed .rows { display: none; }
.row { display: grid; grid-template-columns: 12px 1fr auto; gap: 8px; align-items: center; padding: 5px 14px; cursor: pointer; }
.row:hover { background: var(--panel-2); }
.row.sel { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.row .name { font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .meta { color: var(--muted); font: 11px var(--mono); white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.dot.success { background: var(--ok); } .dot.failed, .dot.crashed { background: var(--bad); }
.dot.gave_up { background: var(--warn); } .dot.stalled { background: transparent; border: 2px solid var(--muted); }
.dot.running { background: var(--run); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
main { overflow-y: auto; min-width: 0; }
.empty { padding: 60px 32px; color: var(--muted); }
.wrap { max-width: 1080px; margin: 0 auto; padding: 20px 28px 80px; }
.top h2 { margin: 0; font-size: 18px; }
.top .instr { margin: 4px 0 12px; font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { border: 1px solid var(--border); background: var(--panel); border-radius: 999px; padding: 2px 10px; font: 12px var(--mono); }
.chip.success { color: var(--ok); border-color: var(--ok); } .chip.failed, .chip.crashed { color: var(--bad); border-color: var(--bad); }
.chip.gave_up { color: var(--warn); border-color: var(--warn); } .chip.running { color: var(--run); border-color: var(--run); }
.controls { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; color: var(--muted); font-size: 12px; }
.controls button { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
details.sys { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; }
details.sys summary { padding: 8px 12px; cursor: pointer; font-weight: 600; }
details.sys pre { margin: 0; padding: 0 12px 12px; }
pre { white-space: pre-wrap; word-break: break-word; font: 12.5px/1.5 var(--mono); margin: 0; }
video.ep { width: 100%; max-width: 860px; border-radius: 8px; border: 1px solid var(--border); background: #000; display: block; margin-bottom: 18px; }
.timeline { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.card .hd { display: flex; gap: 8px; align-items: baseline; margin-bottom: 6px; font-size: 12px; color: var(--muted); }
.card .hd b { color: var(--text); font-size: 13px; }
.card.model { border-left: 3px solid var(--accent); }
.card.tool { border-left: 3px solid var(--ok); }
.card.user { border-left: 3px solid var(--muted); }
.card.rejected { border-left: 3px solid var(--bad); }
.card.end { border-left: 3px solid var(--warn); }
.card.end.success { border-left-color: var(--ok); }
.note { font-size: 14px; margin-bottom: 6px; }
.args { background: var(--code); border-radius: 6px; padding: 6px 8px; }
.reasoning { color: var(--muted); font-style: italic; margin-bottom: 6px; white-space: pre-wrap; }
.foot { margin-top: 6px; color: var(--muted); font: 11px var(--mono); }
.text + .text, .text + .imgs, .imgs + .text { margin-top: 8px; }
.text pre { background: var(--code); border-radius: 6px; padding: 6px 8px; }
.imgs { display: flex; flex-wrap: wrap; gap: 8px; }
.imgs img { max-width: min(100%, 560px); border-radius: 6px; border: 1px solid var(--border); cursor: zoom-in; display: block; }
.motion { margin: -2px 0 0 14px; padding: 4px 10px; border-left: 2px dashed var(--border); color: var(--muted); font: 12px var(--mono); }
.motion .bad { color: var(--bad); }
#lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 10; cursor: zoom-out; }
#lightbox img { max-width: 96vw; max-height: 94vh; }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--border); }
  .wrap { padding: 16px; }
}
</style>
</head>
<body>
<div class="app">
  <aside>
    <header>
      <h1>VLM episodes</h1>
      <div class="root" id="root"></div>
      <input id="filter" placeholder="Filter: task, model, harness, status…" autocomplete="off">
    </header>
    <div id="list"></div>
  </aside>
  <main id="main"><div class="empty">Select an episode.</div></main>
</div>
<div id="lightbox"><img alt=""></div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (x) => (x == null ? "–" : "$" + x.toFixed(x < 1 ? 3 : 2));
const STATUS = { success: "success", failed: "failed", gave_up: "gave up", running: "running", stalled: "stalled", crashed: "crashed" };
const collapsed = new Set(JSON.parse(localStorageGet("collapsed") || "[]"));
let episodes = [], current = null, es = null, view = null;

function localStorageGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function localStorageSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

// ---- episode list -------------------------------------------------------------------------------
async function loadEpisodes() {
  try {
    const r = await (await fetch("/api/episodes")).json();
    $("#root").textContent = r.root;
    episodes = r.episodes;
    renderList();
  } catch (e) { $("#root").textContent = "cannot reach the server"; }
}
function renderList() {
  const q = $("#filter").value.trim().toLowerCase();
  const groups = {};
  for (const e of episodes) {
    const hay = `${e.group} ${e.task} ${e.task_dir} ${e.model} ${e.harness} ${e.status}`.toLowerCase();
    if (q && !q.split(/\s+/).every((w) => hay.includes(w))) continue;
    (groups[e.group] ||= []).push(e);
  }
  $("#list").innerHTML = Object.entries(groups).map(([g, rows]) => {
    const ok = rows.filter((r) => r.status === "success").length, done = rows.filter((r) => !["running", "stalled"].includes(r.status)).length;
    return `<div class="group${collapsed.has(g) ? " closed" : ""}" data-g="${esc(g)}">
      <div class="gname">${collapsed.has(g) ? "▸" : "▾"} ${esc(g)} · ${ok}/${done}</div>
      <div class="rows">${rows.map((r) => `<div class="row${current === r.id ? " sel" : ""}" data-id="${esc(r.id)}" title="${esc(r.id)}">
        <span class="dot ${r.status}"></span>
        <span class="name">${esc(r.task_dir)} · ep ${esc(r.episode)}</span>
        <span class="meta">${r.steps}${r.max_steps ? "/" + r.max_steps : ""} st · ${r.llm_calls} calls · ${money(r.cost_usd)}</span>
      </div>`).join("")}</div></div>`;
  }).join("") || `<div class="empty">No episodes with an ${"events.jsonl"} under this root.</div>`;
}
$("#list").addEventListener("click", (ev) => {
  const row = ev.target.closest(".row");
  if (row) return select(row.dataset.id);
  const g = ev.target.closest(".gname")?.parentElement;
  if (g) { const k = g.dataset.g; collapsed.has(k) ? collapsed.delete(k) : collapsed.add(k); localStorageSet("collapsed", JSON.stringify([...collapsed])); renderList(); }
});
$("#filter").addEventListener("input", renderList);

// ---- one episode --------------------------------------------------------------------------------
const fileUrl = (p) => `/api/file?ep=${encodeURIComponent(current)}&path=${encodeURIComponent(p)}`;
function select(id) {
  if (es) { es.close(); es = null; }
  current = id;
  history.replaceState(null, "", "#ep=" + encodeURIComponent(id));
  renderList();
  // `live` turns on once the server has replayed the episode so far (snapshot_end): only then does the page
  // follow new turns, so opening a finished episode stays at the top.
  view = { start: null, end: null, calls: 0, cost: 0, steps: 0, maxReward: null, follow: true, lastSeq: 0, live: false };
  $("#main").innerHTML = `<div class="wrap"><div id="top"></div><div id="sys"></div><div id="video"></div><div class="timeline" id="tl"></div></div>`;
  $("#main").scrollTop = 0;
  es = new EventSource(`/api/events?ep=${encodeURIComponent(id)}`);
  es.onmessage = (m) => onEvent(JSON.parse(m.data));
  es.addEventListener("snapshot_end", () => {
    if (view.live) return;  // a reconnect replays the snapshot again
    view.live = true;
    // A running episode opens at its newest turn; a finished one stays at the top.
    if (!view.end) $("#main").scrollTop = $("#main").scrollHeight;
  });
  es.addEventListener("episode_end", () => { es.close(); es = null; });
  es.onerror = () => { if (view && view.end) { es?.close(); es = null; } };
}
function onEvent(e) {
  const tl = $("#tl");
  // EventSource reconnects with the same URL after a dropped connection, so the stream starts over.
  if (!tl || e.seq <= view.lastSeq) return;
  view.lastSeq = e.seq;
  const nearBottom = $("#main").scrollHeight - $("#main").scrollTop - $("#main").clientHeight < 120;
  if (e.kind === "episode_start") { view.start = e; renderSys(e); }
  else if (e.kind === "message") tl.insertAdjacentHTML("beforeend", messageCard(e));
  else if (e.kind === "model_call") { view.calls += 1; view.cost += e.cost_usd || 0; tl.insertAdjacentHTML("beforeend", modelCard(e)); }
  else if (e.kind === "motion") { view.steps = e.step; view.maxReward = e.max_reward; tl.insertAdjacentHTML("beforeend", motionRow(e)); }
  else if (e.kind === "episode_end") { view.end = e; view.steps = e.steps ?? view.steps; tl.insertAdjacentHTML("beforeend", endCard(e)); renderVideo(e); loadEpisodes(); }
  renderTop();
  if (view.live && view.follow && !view.end && nearBottom) $("#main").scrollTop = $("#main").scrollHeight;
}
function statusOf() {
  const e = view.end;
  if (!e) return episodes.find((x) => x.id === current)?.status === "stalled" ? "stalled" : "running";
  return e.crashed ? "crashed" : e.success ? "success" : e.gave_up ? "gave_up" : "failed";
}
function renderTop() {
  const s = view.start || {}, st = statusOf();
  const dur = view.start ? ((view.end?.ts || Date.now() / 1000) - view.start.ts) : null;
  $("#top").innerHTML = `<div class="top">
    <h2>${esc(s.task || current)} · episode ${esc(s.episode ?? "")}</h2>
    <div class="instr">${esc(s.instruction || "")}</div>
    <div class="chips">
      <span class="chip ${st}">${STATUS[st]}</span>
      <span class="chip">${esc(s.model || "?")} · ${esc(s.reasoning_effort || "")}</span>
      <span class="chip">harness ${esc(s.harness || "?")}</span>
      <span class="chip">steps ${view.steps}/${s.max_episode_steps ?? "?"}</span>
      <span class="chip">calls ${view.calls}/${s.max_calls ?? "?"}</span>
      <span class="chip">max reward ${view.maxReward == null ? "–" : (+view.maxReward).toFixed(3)}</span>
      <span class="chip">cost ${money(view.cost || null)}</span>
      ${dur != null ? `<span class="chip">${(dur / 60).toFixed(1)} min</span>` : ""}
    </div></div>`;
}
function renderSys(s) {
  $("#sys").innerHTML = `<details class="sys"><summary>Instructions and tools</summary>
    <pre>${esc(s.instructions)}</pre>
    <pre>${esc(JSON.stringify(s.tools, null, 2))}</pre></details>`;
}
function renderVideo(e) {
  if (e.video) $("#video").innerHTML = `<video class="ep" src="${fileUrl(e.video)}" controls preload="metadata"></video>`;
}
function partsHtml(parts) {
  return (parts || []).map((p) => p.type === "image"
    ? `<div class="imgs"><img src="${fileUrl(p.path)}" loading="lazy" alt="${esc(p.path)}"></div>`
    : `<div class="text"><pre>${esc(p.text)}</pre></div>`).join("");
}
function messageCard(e) {
  const isTool = e.role === "tool";
  const cls = e.rejected ? "rejected" : isTool ? "tool" : "user";
  const label = isTool ? (e.rejected ? `Rejected · call ${e.call}` : `Tool result · call ${e.call}`) : (e.call ? `User · before call ${e.call + 1}` : "User");
  return `<div class="card ${cls}"><div class="hd"><b>${label}</b><span>step ${e.step}</span></div>${partsHtml(e.parts)}</div>`;
}
function modelCard(e) {
  const args = e.arguments && typeof e.arguments === "object" ? { ...e.arguments } : e.arguments;
  // ours calls it `reasoning`, RoboProbe `note`
  const note = args && typeof args === "object" ? (args.reasoning ?? args.note) : null;
  if (args && typeof args === "object") { delete args.reasoning; delete args.note; }
  const u = e.usage;
  const tokens = u ? `${u.input} in (${u.cached} cached) · ${u.output} out (${u.reasoning} reasoning)` : "no usage (replay)";
  return `<div class="card model"><div class="hd"><b>Model · call ${e.call}</b><span>${esc(e.tool || "no tool call")}</span><span>step ${e.step}</span></div>
    ${(e.reasoning || []).map((r) => `<div class="reasoning">${esc(r)}</div>`).join("")}
    ${e.text ? `<div class="text"><pre>${esc(e.text)}</pre></div>` : ""}
    ${note ? `<div class="note">${esc(note)}</div>` : ""}
    ${args && (typeof args !== "object" || Object.keys(args).length) ? `<div class="args"><pre>${esc(typeof args === "object" ? JSON.stringify(args, null, 1) : args)}</pre></div>` : ""}
    <div class="foot">${tokens} · ${money(e.cost_usd)} · ${e.latency_s}s</div></div>`;
}
function motionRow(e) {
  return `<div class="motion">motion: ${e.steps_used} steps (${(e.steps_used / (view.start?.control_hz || 30)).toFixed(1)} s) → step ${e.step}
    · arrival: ${esc(e.arrival)}${e.aborted ? ` · <span class="bad">aborted: ${esc(e.aborted)}</span>` : ""}
    · max reward ${(+e.max_reward).toFixed(3)}${e.success ? " · success" : ""}${e.truncated ? " · step limit" : ""}</div>`;
}
function endCard(e) {
  const st = statusOf();
  return `<div class="card end ${st}"><div class="hd"><b>Episode ended: ${STATUS[st]}</b></div>
    <pre>${esc(e.crashed ? e.error : `steps ${e.steps} · calls ${e.llm_calls} · max reward ${(+e.max_reward).toFixed(3)} · cost ${money(e.cost_usd)}${e.truncated ? " · hit the step limit" : ""}`)}</pre></div>`;
}

// ---- image lightbox -----------------------------------------------------------------------------
$("#main").addEventListener("click", (ev) => {
  if (ev.target.tagName === "IMG") { $("#lightbox img").src = ev.target.src; $("#lightbox").style.display = "flex"; }
});
$("#lightbox").addEventListener("click", () => { $("#lightbox").style.display = "none"; });
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") $("#lightbox").style.display = "none"; });

loadEpisodes().then(() => {
  const m = location.hash.match(/ep=([^&]+)/);
  if (m) select(decodeURIComponent(m[1]));
});
setInterval(loadEpisodes, 10000);
</script>
</body>
</html>
