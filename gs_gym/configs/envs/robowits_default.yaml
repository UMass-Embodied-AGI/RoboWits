genesis_init:
  seed: 42
  precision: "float32"
  logging_level: "INFO"
  backend: null

scene:
  type: "flat"
  size: [1.0, 1.0, 0.1]
  position: [0.0, 0.0, 0.0]
  gravity: [0.0, 0.0, -9.81]
  dt: 0.0333
  # 16 substeps let Genesis's rigid contact time constant (clamped to >= 2 substeps) drop to 5 ms. At 4 substeps it
  # was 16.7 ms, soft enough that grasped objects sank into the fingers: 5.8 mm through task 04's 1.7 mm card and
  # 20 mm into 09_01's cup. Tasks that set their own substeps (SPH/MPM, 26, 16_06) keep their count.
  substeps: 16
  constraint_timeconst: 0.005
  show_viewer: false
  show_fps: false
  ground_friction: 1.0
  ground_restitution: 0.0

robot:
  type: "bimanual_marvin"
  position: [0.0, 0.0, 1.08]
  euler: [0.0, 0.0, 0.0]
  joint_damping: 0.1
  joint_armature: 0.1
  action_scale: 1.0
  max_joint_velocity: 2.0

# Reachable bounds for object placement (x_range, y_range).
# x_min must stay behind the table's front edge (x = 0.211): at 0.2 the sampler could
# anchor an object just off the table, which settles as a fall rather than a placement.
reachable_bounds:
  x: [0.23, 0.7]
  y: [-0.45, 0.45]

termination:
  max_episode_steps: 200
